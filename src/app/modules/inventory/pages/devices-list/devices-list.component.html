<div class="p-grid ml-2 m-2">
  <div class="p-col" style="text-align: right">
    <span
      class="mt-2"
      style="float: left; font-weight: 600; font-family: 'public-sans'"
      >Devices</span
    >
    <p-button (click)="navigateToAdd()" label="Add Device" size="small">
      <span class="ml-1 mr-1 add">
        <i class="pi pi-plus add-icon"></i>
      </span>
    </p-button>
  </div>
</div>
<div class="mt-3">
  <oc-table
    [showSearchBar]="true"
    [url]="{
      getAll: '/device/GetGrid',
      export: '/device/Export',
    }"
    [addButtonLabel]="'Add Device'"
    [columns]="columns"
    [buttonsExistance]="tableBtns"
    [actions]="actions"
    [filters]="filters"
    [options]="{
      check: false,
      hasActionMenu: true,
      viewDetails: viewDetails,
      viewDetailsURL: '/main/inventory/devices/details',
    }"
    [uploadHeader]="'Upload Bulk Devices'"
    [sampleName]="'ImportWarehouseTemplate.xlsx'"
    [service]="service"
    [modulePageName]="'Device'"
    [gridActionsList]="gridActionsList"
  >
  </oc-table>
</div>

<div class="card flex justify-content-center">
  <p-confirmDialog key="myDialog"> </p-confirmDialog>
</div>

<p-dialog
  [contentStyle]="{ overflow: 'visible' }"
  [header]="isApproved ? 'Approve' : 'Reject'"
  [modal]="true"
  [(visible)]="showDecisionDialog"
  [style]="{ width: '35rem' }"
>
  <div class="mb-3">
    <label for="username" class="font-semibold w-6rem">Condition</label>
    <p-dropdown
      [options]="allConditions"
      [(ngModel)]="conditionId"
      [optionValue]="'id'"
      optionLabel="nameEn"
      filter="true"
    />
  </div>
  <div class="flex justify-content-end gap-2">
    <p-button
      label="Cancel"
      size="small"
      (onClick)="showDecisionDialog = false"
      [outlined]="true"
    />
    <p-button
      [label]="isApproved ? 'Approve' : 'Reject'"
      size="small"
      (onClick)="takeAction()"
    />
  </div>
</p-dialog>

<p-dialog
  [contentStyle]="{ overflow: 'visible' }"
  [header]="isApproved ? 'Approve' : 'Reject'"
  [modal]="true"
  [(visible)]="showCancellationDecisionDialog"
  [style]="{ width: '35rem' }"
>
  <div class="mb-3">
    <label for="username" class="block-paading font-semibold w-6rem"
      >Condition</label
    >
    <p-dropdown
      [options]="allConditions"
      [(ngModel)]="conditionId"
      [optionValue]="'id'"
      optionLabel="nameEn"
      filter="true"
    />
  </div>

  <div *ngIf="isApproved" class="mb-3">
    <label for="username" class="block-paading font-semibold w-6rem"
      >Warehouse</label
    >
    <p-dropdown
      [options]="warehousesList"
      [(ngModel)]="warehouseId"
      [optionValue]="'id'"
      optionLabel="nameEn"
      filter="true"
    />
  </div>

  <div class="flex justify-content-end gap-2">
    <p-button
      label="Cancel"
      size="small"
      (onClick)="showCancellationDecisionDialog = false"
      [outlined]="true"
    />
    <p-button
      [label]="isApproved ? 'Approve Cancellation' : 'Reject Cancellation'"
      size="small"
      (onClick)="reviewCancellation()"
    />
  </div>
</p-dialog>

<p-dialog
  [contentStyle]="{ overflow: 'visible' }"
  [header]="'Return Custody'"
  [modal]="true"
  [(visible)]="showreturnToWarehouseDialog"
>
  <div class="grid">
    <div class="col-6">
      <div class="mb-3">
        <label for="username" class="font-semibold block-paading"
          >Device Condition</label
        >
        <p-dropdown
          [options]="allConditions"
          [(ngModel)]="conditionId"
          [optionValue]="'id'"
          optionLabel="nameEn"
          filter="true"
        />
      </div>
    </div>
    <div class="col-6">
      <div class="mb-3">
        <label class="font-semibold block-paading">Warehouse</label>
        <p-dropdown
          [options]="warehousesList"
          [(ngModel)]="warehouseId"
          [optionValue]="'id'"
          optionLabel="nameEn"
          filter="true"
        />
      </div>
    </div>
  </div>

  <div class="flex justify-content-end gap-2">
    <p-button
      label="Cancel"
      size="small"
      (onClick)="showreturnToWarehouseDialog = false"
      [outlined]="true"
    />
    <p-button [label]="'Return'" size="small" (onClick)="returnToWarehouse()" />
  </div>
</p-dialog>
