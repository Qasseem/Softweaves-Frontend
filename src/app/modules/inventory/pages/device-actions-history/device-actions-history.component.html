<div class="p-grid ml-2 m-2">
  <div class="p-col">
    <span
      (click)="backToList()"
      class="mt-2 ml-3"
      style="color: #0080f9; cursor: pointer"
      >Device</span
    >
    <span class="mt-2 ml-2 mr-2">></span>
    <span class="mt-2"> Actions History</span>
  </div>
</div>
<div class="grid"></div>
<p-divider></p-divider>
<div class="col-12 pl-4 pr-4">
  <div class="mt-1">
    <oc-list
      [clientSide]="true"
      [data]="data ? data : []"
      [columnsI]="columns"
      [options]="{
              check: false,
              viewDetails: true,
              viewDetailsURL: '/main/inventory/devices/actiondetails/',
              viewDetailsPropName: 'id',
            }"
      [actions]="[1]"
      [modulePageName]="'Shipments'"
    >
    </oc-list>
  </div>
</div>
