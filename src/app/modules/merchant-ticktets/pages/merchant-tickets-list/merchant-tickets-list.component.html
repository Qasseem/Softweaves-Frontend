    >

      (click)="navigateToAdd()"

      <span class="ml-1 mr-1 add">

<div class="mt-3">
  <oc-table
    [showSearchBar]="true"
    [url]="{
      getAll: '/MerchantTicketPortal/GetGrid',
      export: '/MerchantTicketPortal/ExportGrid',
      import: '/Ticket/ImportTickets',
      exportDetails: '/Ticket/ExportTicketTasks',
    }"
    [addButtonLabel]="'Add Ticket'"
    [columns]="columns"
    [buttonsExistance]="tableBtns"
    [actions]="actions"
    [options]="{
    check: false,
    hasActionMenu: true,
    viewDetails: viewDetails,
    viewDetailsURL: '/main/merchanttickets/details/',
  }"
    [filters]="filters"
    [uploadHeader]="'Upload Bulk Cancellation'"
    [sampleName]="'ImportTicketCancellationTemplate.xlsx'"
  >
  </oc-table>
</div>
