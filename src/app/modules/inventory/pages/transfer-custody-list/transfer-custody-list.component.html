<div class="p-grid ml-2 m-2">
  <div class="p-col" style="text-align: right">
    <span
      class="mt-2"
      style="float: left; font-weight: 600; font-family: 'public-sans'"
      >Transfer Custody</span
    >
    <p-button
      (click)="navigateToAdd()"
      label="Add Transfer Custody"
      size="small"
    >
      <span class="ml-1 mr-1 add">
        <i class="pi pi-plus add-icon"></i>
      </span>
    </p-button>
  </div>
</div>
<div class="mt-3">
  <oc-table
    [showSearchBar]="true"
    [url]="{
      getAll: '/transfer/GetGrid',
      export: '/transfer/Export',
    }"
    [addButtonLabel]="'Add Transfer Custody'"
    [columns]="columns"
    [buttonsExistance]="tableBtns"
    [actions]="actions"
    [filters]="filters"
    [options]="{
      check: false,
      hasActionMenu: true,
      viewDetails: viewDetails,
      viewDetailsURL: '/main/inventory/transfercustody/details',
    }"
    [service]="service"
    [modulePageName]="'Transfer Custody'"
  >
  </oc-table>
</div>

<div class="card flex justify-content-center">
  <p-confirmDialog key="myDialog"> </p-confirmDialog>
</div>
